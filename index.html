<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#141b20">
  <title>REAMDE — атлас маршрутов</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="./styles.css">
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script type="module" src="./app.js"></script>
</head>
<body>
  <main>
    <header>
      <div class="masthead"><h1>REAMDE <span>Атлас маршрутов</span></h1><span id="limit"></span></div>
      <div class="controls">
        <label><span class="sr">Поиск места или события</span><input id="search" type="search" placeholder="Место или событие"></label>
        <button id="characters" aria-controls="character-panel" aria-expanded="false">Персонажи</button>
        <button id="fit" aria-label="Показать на карте" title="Показать на карте">⌖</button>
      </div>
      <nav id="days" aria-label="Дни книги"></nav>
    </header>
    <section class="map-stage" aria-label="Карта маршрутов">
      <div id="map"></div>
      <aside id="character-panel" hidden aria-label="Персонажи">
        <div id="groups" class="groups"></div>
        <div id="character-list"></div>
      </aside>
      <section id="detail" aria-label="Карточка" hidden>
        <button id="close" aria-label="Закрыть карточку">×</button>
        <div id="content"></div>
      </section>
      <div class="legend"><span></span> Схема пути</div>
    </section>
    <footer>
      <button id="results-button" aria-controls="results" aria-expanded="false">Сцены и маршруты</button>
      <span id="status" role="status">Загрузка атласа…</span>
    </footer>
    <section id="results" hidden aria-label="Результаты поиска"></section>
  </main>
</body>
</html>
